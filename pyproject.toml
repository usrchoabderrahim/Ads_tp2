[project]
name = "python-uv-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mesa>=3.5.1",
    "networkx>=3.7",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
]

[project.scripts]
python-uv-workspace = "python_uv_workspace:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
